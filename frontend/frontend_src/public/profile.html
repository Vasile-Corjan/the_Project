<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/profile.css">
    <title>Profile</title>
</head>
<body>
  <header class="appHeader">
    <div class="appHeader-bar">
      <div class="appHeader-bar-left">
        <a href="/">LOGO</a>
      </div>
      <div class="appHeader-bar-right">
        <div class="appHeader-user">
          <img src="./static/avatar-user.png" alt="" sizes="32" height="32" width="32">
        </div>
      </div>
    
      <nav class="nav">
        <ul>
          
        </ul>
      </nav>
    </div>
  </header>
  <div class="app-main">
    <aside class="side-bar">
      <div>

      </div>
    </aside>
    <main class="profile-container">
      <div class="profile-feed">
        <div class="profile-card">
            <h1>Home</h1>
            <div class="profile-info">
                <div class="info-group">
                    <label>Username:</label>
                    <span id="username"></span>
                </div>
                <div class="info-group">
                    <label>Email:</label>
                    <span id="email"></span>
                </div>
            </div>
            <div class="profile-actions">
                <button onclick="window.location.href='/viewer'">Go to Viewer</button>
                <button onclick="localStorage.clear(); window.location.href='/signin'">Sign Out</button>
            </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
