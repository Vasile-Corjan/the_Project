<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/signin.css">
    <title>signin</title>
</head>
<body>
    <main>
        <form class="form" id="signinForm">
            <h1 class="title">Sign In </h1>
                <label>
                    <span>Username or email</span>
                    <input required="required" placeholder="" type="text" class="input" name="username">
                </label> 
                <label>
                    <span>Password</span>
                    <input required="required" placeholder="" type="password" class="input" name="password">
                </label>
                <button type="submit" class="submit">Sign In</button>
        </form>
    </main>
</body>
</html>
