<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles/register.css">
  <title>signup</title>
</head>

<body>
  <main>
    <form class="form" id="registerForm">
      <h1 class="title">Register</h1>
      <p class="message">Sign-up now and get full access to our app. </p>
      <div class="flex">
        <label>
          <span>First Name</span>
          <input required="required" placeholder="" type="text" class="input" name="first_name" id="first_name">
        </label>
        <label>
          <span>Last Name</span>
          <input required="required" placeholder="" type="text" class="input" name="last_name" id="last_name">
        </label>
      </div>
      <label>
        <span>Email</span>
        <input placeholder="" type="email" class="input" name="email" id="email" required>
      </label>
      <label>
        <span>Username</span>
        <input placeholder="" type="text" class="input" name="username" id="username" required>
        <p id="username-helper" class="help-message">Username may only contain alphanumeric characters or single
          hyphens, and cannot begin or end with a hyphen.</p>
      </label>
      <label>
        <span>Password</span>
        <input required="required" placeholder="" type="password" class="input" name="password" id="password">
        <p id="password-helper" class="help-message">Password should be at least 15 characters OR at least 8 characters
          including a number and a lowercase letter.</p>
      </label>
      <label>
        <span>Confirm password</span>
        <input placeholder="" type="password" class="input" name="confirm_password" id="confirm_password">
      </label>
      <button type="submit" class="submit">Submit</button>
      <p class="signin">Already have an acount ? <a href="signin">Sign in</a></p>
    </form>
  </main>
</body>

</html>
