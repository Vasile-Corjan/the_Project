<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/register.css">
    <title>signup</title>
</head>
<body>
    <main>
        <form class="form" id="registerForm">
            <h1 class="title">Register </h1>
            <p class="message">Sign-up now and get full access to our app. </p>
                <div class="flex">
                    <label>
                        <span>First Name</span>
                        <input required="required" placeholder="" type="text" class="input" name="username" id="username">
                    </label>
                    <!-- <label>
                        <span>Last Name</span>
                        <input required="required" placeholder="" type="text" class="input">
                    </label> -->
                </div>  
                <label>
                    <span>Email</span>
                    <input  placeholder="" type="email" class="input" name="email" id="email" required>
                </label> 
                <label>
                    <span>Password</span>
                    <input required="required" placeholder="" type="password" class="input" name="password" id="password">
                </label>
                <label>
                    <span>Confirm password</span>
                    <input  placeholder="" type="password" class="input" name="password2" id="password2">
                </label>
                <button type="submit" class="submit">Submit</button>
                <p class="signin">Already have an acount ? <a href="signin">Sign in</a></p>
        </form>
    </main>
</body>
</html>
