<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - AEClab</title>
  <link rel="stylesheet" href="styles/register.css">
</head>

<body class="register-page">
  <header class="register-page_header">
    <div class="register-page_logo">
      <a href="/"><img src="logo.png" alt="Logo"></a>
    </div>
  </header>
  <form class="register-page_form" id="registerForm">
    <p class="register-page_title">Register</p>
    <p class="register-page_message">Signup now and get full access to our app.</p>

    <div class="register-page_flex">
      <label>
        <input class="register-page_input" type="text" placeholder="" name="first_name" required>
        <span>First Name</span>
      </label>

      <label>
        <input class="register-page_input" type="text" placeholder="" name="last_name" required>
        <span>Last Name</span>
      </label>
    </div>

    <label>
      <input class="register-page_input" type="text" placeholder="" name="username" required>
      <span>Username</span>
    </label>

    <label>
      <input class="register-page_input" type="email" placeholder="" name="email" required>
      <span>Email</span>
    </label>

    <label>
      <input class="register-page_input" type="password" placeholder="" name="password" required>
      <span>Password</span>
    </label>
    <p class="register-page_help-message">Password must be at least 8 characters long</p>

    <label>
      <input class="register-page_input" type="password" placeholder="" name="confirm_password" required>
      <span>Confirm password</span>
    </label>

    <button class="register-page_submit">Submit</button>

    <p class="register-page_signin-link">
      Already have an account? <a href="signin">Sign in</a>
    </p>
  </form>
</body>

</html>
