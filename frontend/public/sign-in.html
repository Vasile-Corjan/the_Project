<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/sigin.css">
    <title>signin</title>
</head>
<body>
    <main>
        <form class="form" id="sign-in-form">
            <h1 class="title">Sign In </h1>
                <label>
                    <span>Username or email</span>
                    <input required="required" placeholder="" type="text" class="input" name="username">
                </label> 
                <label>
                    <span>Password</span>
                    <input required="required" placeholder="" type="password" class="input" name="password">
                </label>
                <button type="submit" class="submit">Sign In</button>
        </form>
    </main>
    <script>
        document.getElementById('sign-in-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const formData = new FormData(event.target);
            const data = {
                username: formData.get('username'),
                password: formData.get('password')
            };
            const response = await fetch('http://localhost:8000/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            if (response.ok) {
                window.location.href = '/src';
            } else {
                alert('Login failed');
            }
        });
    </script>
</body>
</html>
