<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/signup.css">
    <title>signup</title>
</head>
<body>
    <main>
        <form class="form" id="sign-up-form">
            <h1 class="title">Register </h1>
            <p class="message">Sign-up now and get full access to our app. </p>
                <div class="flex">
                    <label>
                        <span>First Name</span>
                        <input required="required" placeholder="" type="text" class="input">
                    </label>
                    <label>
                        <span>Last Name</span>
                        <input required="required" placeholder="" type="text" class="input">
                    </label>
                </div>  
                <label>
                    <span>Email</span>
                    <input required="required" placeholder="" type="email" class="input">
                </label> 
                <label>
                    <span>Password</span>
                    <input required="required" placeholder="" type="password" class="input">
                </label>
                <label>
                    <span>Confirm password</span>
                    <input required="" placeholder="" type="password" class="input">
                </label>
                <button type="submit" class="submit">Submit</button>
                <p class="signin">Already have an acount ? <a href="./sign-in.html">Sign in</a> </p>
        </form>
    </main>
    <script>
        document.getElementById('sign-up-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const formData = new FormData(event.target);
            const data = {
                username: formData.get('email'),
                password: formData.get('password'),
                email: formData.get('email')
            };
            const response = await fetch('http://localhost:8000/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            if (response.ok) {
                window.location.href = '/src';
            } else {
                alert('Registration failed');
            }
        });
    </script>
</body>
</html>
